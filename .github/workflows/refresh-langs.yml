name: Refresh language card

# Keeps assets/langs-live.svg (the "Languages - Present" card in README.md) up to date
# WITHOUT the README ever depending on a live third-party service at view time.
#
# What it measures: languages by the code the USER ACTUALLY AUTHORED - NET lines
# (additions - deletions) in the user's own commits, deduped by commit hash across ALL
# branches, over every repo the user owns (incl. forks and private) PLUS repos they
# contributed to but do not own (org repos, upstreams). Rendered by
# .github/scripts/render_authored_langs.py (see that file for the full method).
#
# Cadence: runs DAILY but only regenerates when the committed card is >= 28 days old
# (~monthly). A successful run commits the new card and resets the clock; a failed/skipped
# run commits nothing, so the next day retries.
#
# Auth (LANGS_PAT): the collector reads the user's private/org repos, which the default
# github.token cannot see -- so it authenticates with the LANGS_PAT secret (a PAT with repo
# read). If LANGS_PAT is absent the render step SKIPS rather than producing an undercounted
# card. Create it once:  gh secret set LANGS_PAT   (fine-grained: Contents+Metadata read on
# all repos, or a classic PAT with the `repo` scope).
#
# Cost/cache: the first crawl fetches every one of the user's commits' file stats (can be
# thousands of API calls / several minutes); results are cached (sha -> per-language
# add/del) via actions/cache, so later runs only fetch commits they have not seen.

on:
  schedule:
    - cron: "23 7 * * *"        # daily at 07:23 UTC
  workflow_dispatch:            # manual run
    inputs:
      force:
        description: "Refresh now even if the card is not yet 28 days old"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-langs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (full history, so the staleness check can read the card's last commit date)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is a refresh due?
        id: due
        run: |
          set -euo pipefail
          file="assets/langs-live.svg"
          if [ "${{ inputs.force }}" = "true" ] || [ ! -f "$file" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Refresh due (forced or file missing)."
            exit 0
          fi
          last=$(git log -1 --format=%ct -- "$file" 2>/dev/null || echo 0)
          now=$(date -u +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Card is ${age_days} day(s) old (threshold: 28)."
          if [ "$age_days" -ge 28 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Not due yet -- next refresh in $((28 - age_days)) day(s)."
          fi

      - name: Set up Python
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore per-commit stats cache
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: assets/.langs-cache.json
          key: langs-cache-${{ github.run_id }}
          restore-keys: langs-cache-

      - name: Render the language card
        if: steps.due.outputs.due == 'true'
        env:
          # PAT with repo read, so the collector can see the user's private and org repos.
          # The default github.token cannot, and would undercount to public repos only.
          GH_TOKEN: ${{ secrets.LANGS_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=LANGS_PAT not set::Add a LANGS_PAT secret (a PAT with read access to your repos) so private/org repos are counted; skipping so the committed card is not overwritten."
            exit 0
          fi
          python .github/scripts/render_authored_langs.py

      - name: Commit if the card changed
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/langs-live.svg; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs-live.svg
          git commit -m "chore(readme): refresh live language card"
          git push
