name: Refresh profile views card

# Keeps assets/profile-views.svg (the "Profile Views" badge in README.md) up to date WITHOUT the
# README depending on a live service at view time -- the same reliability pattern as
# refresh-langs.yml, and for the same reason.
#
# Why the README should embed the committed SVG rather than /api/badge directly
# ---------------------------------------------------------------------------
# The Consumption plan evicts an idle app after ~20 minutes and a .NET isolated cold start runs 2-7s
# against a Camo socket timeout of roughly 10s. Embedding the live endpoint puts that race in the
# hero row of the profile; embedding the committed file cannot fail, because GitHub serves it.
# The invisible /api/px pixel does the actual counting, so a cold or dead function costs a data point
# instead of a visibly broken badge.
#
# The number therefore lags by up to an hour. That is the deliberate trade.
#
# The card is fetched from /api/badge rather than re-rendered here on purpose: it keeps the SVG
# byte-identical to the live endpoint instead of maintaining the same badge geometry twice. That
# request is classified as a bot/direct hit by the collector, so refreshing the card never inflates
# the view count.
#
# Collector source, design notes and cost model: github.com/Nucs/OssAnalytics (private).
# This workflow lives here rather than there because it commits into this repo.

on:
  schedule:
    # Every 6 hours, not hourly. The job commits whenever the number changes, so an hourly cadence
    # would add up to ~700 bot commits a month to this repo's history for a vanity counter. Six hours
    # caps that at ~4/day while keeping the card reasonably fresh. Change to "41 7 * * *" for daily.
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the badge
        env:
          BADGE_URL: ${{ secrets.ANALYTICS_BADGE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BADGE_URL:-}" ]; then
            echo "::error::ANALYTICS_BADGE_URL secret is not set."
            exit 1
          fi

          mkdir -p assets

          # Retry across a cold start. A failed run commits nothing, leaving the previous card in
          # place, and the next hourly run tries again -- so a transient outage is invisible.
          for attempt in 1 2 3 4 5; do
            if curl -sfS --max-time 30 \
                 -A "nucs-readme-refresh/1.0 (+https://github.com/Nucs)" \
                 "${BADGE_URL}" -o /tmp/views.svg; then
              break
            fi
            echo "attempt ${attempt} failed"
            sleep 10
            if [ "${attempt}" = "5" ]; then
              echo "::error::could not reach the badge endpoint after 5 attempts"
              exit 1
            fi
          done

          # Never commit an error page or a truncated response over a known-good card.
          if ! grep -q "<svg" /tmp/views.svg || ! grep -qE '[0-9]' /tmp/views.svg; then
            echo "::error::response was not a valid badge SVG"
            cat /tmp/views.svg
            exit 1
          fi

          mv /tmp/views.svg assets/profile-views.svg
          grep -o 'aria-label="[^"]*"' assets/profile-views.svg || true

      - name: Commit if the card changed
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/profile-views.svg; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-views.svg
          git commit -m "chore(readme): refresh profile views card"
          git push
